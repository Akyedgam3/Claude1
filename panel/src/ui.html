<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>لوحة وزن</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
:root { --g: #0f6e5c; --g2: #14957c; --soft: #e3f2ee; --ink: #1d2433; --muted: #6b7385; --line: #e3e6eb; --bg: #f4f6f8; --card: #fff; --bad: #c0392b; --warn: #b7791f; --gold: #e7b75a; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Cairo, system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; }
header { background: linear-gradient(135deg, #0b5546, #0f6e5c); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
header b { font-size: 20px; font-weight: 900; }
header .who { margin-inline-start: auto; font-size: 13px; opacity: .9; }
header button { background: rgba(255,255,255,.15); color: #fff; border: 0; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
nav.tabs button { white-space: nowrap; }
nav.tabs button.on { background: var(--g); color: #fff; border-color: var(--g); }
button, .btn { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
button.primary { background: var(--g); border-color: var(--g); color: #fff; }
button.danger { color: var(--bad); border-color: #f1c4be; }
button.wa { background: #25d366; border-color: #25d366; color: #fff; }
button:disabled { opacity: .5; cursor: default; }
button.small { padding: 3px 10px; font-size: 13px; }
input, select, textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; width: 100%; background: #fff; color: var(--ink); }
textarea { min-height: 90px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 12px; font-size: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: end; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat span { color: var(--muted); font-size: 13px; display: block; }
.stat b { font-size: 24px; font-weight: 900; }
.muted { color: var(--muted); font-size: 13px; }
.mono { font-family: ui-monospace, Consolas, monospace; direction: ltr; unicode-bidi: embed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.list { display: grid; gap: 10px; }
.item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.item .top { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.item b.name { font-size: 16px; }
.tag { display: inline-block; font-size: 12px; font-weight: 900; padding: 1px 9px; border-radius: 999px; background: var(--soft); color: var(--g); }
.tag.suspended { background: #fff4e0; color: var(--warn); }
.tag.revoked, .tag.off { background: #fde8e6; color: var(--bad); }
.tag.mob { background: #eef0ff; color: #3b49c9; }
.bal { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 8px 0; }
.bal div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.bal b { font-size: 20px; font-weight: 900; display: block; }
.bal.zero b { color: var(--bad); }
.code { font-family: ui-monospace, Consolas, monospace; direction: ltr; text-align: center; white-space: nowrap; font-size: clamp(17px, 5.6vw, 26px); font-weight: 900; letter-spacing: 2px; background: var(--soft); color: var(--g); padding: 14px 8px; border-radius: 12px; user-select: all; }
.key { font-family: ui-monospace, Consolas, monospace; direction: ltr; font-size: 11px; word-break: break-all; background: var(--bg); padding: 8px; border-radius: 8px; max-height: 90px; overflow: auto; }
.banner { background: #fff7e6; border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.banner.ok { background: var(--soft); border-color: #b9e0d5; }
.banner.bad { background: #fde8e6; border-color: #f1c4be; }
.login { max-width: 380px; margin: 60px auto; }
.login h1 { text-align: center; font-size: 30px; font-weight: 900; color: var(--g); margin: 0 0 4px; }
.toast { position: fixed; bottom: 18px; inset-inline: 16px; margin: 0 auto; max-width: 480px; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px; z-index: 50; white-space: pre-line; }
.toast.bad { background: var(--bad); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 18px; padding: 18px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; }
.modal h2 { margin-top: 0; }
.log li { padding: 6px 0; border-bottom: 1px solid var(--line); list-style: none; }
.log { padding: 0; margin: 0; }
.hidden { display: none !important; }
@media (max-width: 560px) { main { padding: 12px; } .card { padding: 13px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
