<style>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const ei = (x) => x * x * x;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const fmt = (n) => Math.round(n).toLocaleString('en');
const ICONS = __ICONS__;
const icon = (n) => `<span class="ic">${ICONS[n]}</span>`;
window.DURATION = 63.2;

// ── الصور ──
const REC = __REC__;
const FR = {}; const IM = []; const img = (src) => { const i = new Image(); i.src = src; IM.push(i); return i; };
for (const [n, c] of Object.entries(REC)) FR[n] = Array.from({ length: c }, (_, i) => img(`rec/${n}/${String(i).padStart(3, '0')}.jpg`));
const STILL = { currency: img('cap/currency.jpg'), ai: img('rec/ai.jpg') };

// ── آيفون: شريط الحالة (ساعة، شبكة، واي فاي، بطارية) + شاشة التطبيق ──
function iphoneHTML(id, x, y, s = 1) {
  return `<div class="iphone" id="${id}" data-s="${s}" style="left:${x}px;top:${y}px;transform:scale(${s});transform-origin:50% 0">
    <div class="btn" style="left:-5px;top:210px;height:52px"></div><div class="btn" style="left:-5px;top:300px;height:92px"></div><div class="btn" style="left:-5px;top:410px;height:92px"></div>
    <div class="btn" style="right:-5px;top:330px;height:140px"></div>
    <div class="edge"></div><div class="body"></div>
    <div class="scr"><canvas width="952" height="2056"></canvas>
      <div class="notif">${''}</div></div>
    <div class="island"></div><div class="glass"></div></div>`;
}
/** يرسم شاشة الجوال: صورة التطبيق (390 منطقي) تحت شريط الحالة. off = إخفاء الشبكة (بدون إنترنت). */
function drawPhone(id, image, opts = {}) {
  const c = $(id).querySelector('canvas'); const g = c.getContext('2d');
  const key = image && image.src + (opts.off ? 'off' : '') + (opts.batt || '');
  if (c._k === key) return; c._k = key;
  const S = 952 / 390; // بكسل لكل نقطة
  g.fillStyle = '#0d3a31'; g.fillRect(0, 0, 952, 2056);
  const top = 50 * S;
  if (image && image.complete && image.naturalWidth) g.drawImage(image, 0, 0, image.naturalWidth, image.naturalHeight, 0, top - 4 * S, 952, image.naturalHeight * (952 / image.naturalWidth));
  // شريط الحالة
  g.fillStyle = '#0d3a31'; g.fillRect(0, 0, 952, top - 4 * S);
  g.fillStyle = '#fff'; g.font = `700 ${17 * S}px -apple-system, "Helvetica Neue", Arial`; g.textBaseline = 'middle'; g.direction = 'ltr'; g.textAlign = 'center';
  const cy = 27 * S;
  g.fillText('9:41', 66 * S, cy);
  // شبكة (4 أعمدة)
  const sx = 274 * S;
  for (let i = 0; i < 4; i++) { const h = (4 + i * 2.6) * S; g.globalAlpha = opts.off ? 0.3 : 1; g.fillRect(sx + i * 5.2 * S, cy + 5.5 * S - h, 3.4 * S, h); }
  g.globalAlpha = 1;
  // واي فاي
  const wx = 307 * S, wy = cy + 5 * S;
  g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineWidth = 2.2 * S;
  for (let r = 1; r <= 3; r++) { g.globalAlpha = opts.off ? 0.3 : 1; g.beginPath(); g.arc(wx, wy, r * 3.6 * S, -Math.PI * 0.78, -Math.PI * 0.22); g.stroke(); }
  g.globalAlpha = 1; g.beginPath(); g.arc(wx, wy - 0.2 * S, 1.3 * S, 0, 7); g.fill();
  if (opts.off) { g.strokeStyle = '#ff5f5f'; g.lineWidth = 2 * S; g.beginPath(); g.moveTo(wx - 8 * S, wy - 12 * S); g.lineTo(wx + 8 * S, wy + 2 * S); g.stroke(); }
  // بطارية
  const bx = 326 * S, by = cy - 6.5 * S, bw = 25 * S, bh = 12.5 * S, lvl = opts.batt ?? 0.82;
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.2 * S; g.beginPath(); g.roundRect(bx, by, bw, bh, 3.6 * S); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.roundRect(bx + bw + 1.2 * S, by + 4 * S, 1.6 * S, 4.5 * S, 1 * S); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.roundRect(bx + 2 * S, by + 2 * S, (bw - 4 * S) * lvl, bh - 4 * S, 2 * S); g.fill();
  // مؤشر الهوم
  g.fillStyle = 'rgba(20,20,20,.8)'; g.beginPath(); g.roundRect(476 / 2 * 2 - 68 * S, 2056 - 9 * S, 136 * S, 5 * S, 3 * S); g.fill();
}
function phoneRec(id, name, x, opts) { const f = FR[name]; drawPhone(id, f[Math.round(clamp(x) * (f.length - 1))], opts); }

function laptopHTML(id, x, y, src, w = 900) { return `<div class="laptop" id="${id}" style="left:${x}px;top:${y}px;width:${w}px"><div class="lid"><img src="${src}" alt="" /></div><div class="base"></div></div>`; }

// ── الكلمات (من التفريغ) ──
const capHTML = (id, words, top = 240, size = 76) => `<div class="cap" id="${id}" style="top:${top}px;font-size:${size}px">${words.map(([w, , cls], i) => `<span class="w${cls ? ' ' + cls : ''}" id="${id}_${i}">${w}</span>`).join(' ')}</div>`;
const CAPS = {};
function cap(id, words, out, top, size) { CAPS[id] = { words, out }; return capHTML(id, words, top, size); }
function capR(t, id) {
  const { words, out } = CAPS[id]; const el = $(id);
  const o = P(t, out - 0.25, out);
  el.style.opacity = (1 - o).toFixed(3); el.style.filter = o > 0.01 ? `blur(${(o * 10).toFixed(1)}px)` : 'none';
  words.forEach(([, at], i) => {
    const w = $(`${id}_${i}`); const x = P(t, at - 0.06, at + 0.32);
    w.style.opacity = eo(x).toFixed(3);
    w.style.transform = `translateY(${((1 - eo(x)) * 28).toFixed(1)}px)`;
    w.style.filter = x < 1 ? `blur(${((1 - eo(x)) * 10).toFixed(1)}px)` : 'none';
  });
}
function fade(el, t, a, b, inD = 0.4, outD = 0.35, dy = 40) {
  const i = eo(P(t, a, a + inD)), o = P(t, b - outD, b);
  el.style.opacity = (i * (1 - o)).toFixed(3);
  el.style.transform = `translateY(${((1 - i) * dy - o * 20).toFixed(1)}px)`;
}
const count = (t, a, b, to) => to * eo5(P(t, a, b));

// ── المشاهد: [id، بداية، نهاية] ──
const SC = [
  ['s1', 0, 4.1], ['s2', 4.0, 7.05], ['s3', 6.95, 9.45], ['s4', 9.35, 12.2], ['s5', 12.1, 16.1], ['s6', 16.0, 18.72], ['s7', 18.6, 24.0],
  ['s8', 23.85, 25.75], ['s9', 25.6, 28.65], ['s10', 28.5, 33.35], ['s11', 33.2, 36.5], ['s12', 36.35, 40.45], ['s13', 40.35, 44.55],
  ['s14', 44.45, 50.6], ['s15', 50.5, 55.85], ['s16', 55.75, 58.2], ['s17', 58.1, 63.2],
];
const tx = [['مبيع', '+ 45,000'], ['شراء بضاعة', '− 120,000'], ['مبيع', '+ 8,500'], ['كهربا', '− 35,000'], ['مبيع', '+ 62,000'], ['دين زبون', '− 18,000'], ['مبيع', '+ 14,250'], ['أجار', '− 400,000'], ['مبيع', '+ 9,750'], ['شراء', '− 76,500'], ['مبيع', '+ 31,000'], ['مصروف', '− 12,500']];
const debts = [['أبو خالد', '11,000'], ['أم محمد', '6,420'], ['مطعم الضيعة', '24,800'], ['أبو سمير', '9,300'], ['محل الأمانة', '41,000'], ['جارنا سليم', '5,500']];
const H = {
  s1: `<div id="feedm" class="abs" style="inset:0;-webkit-mask:linear-gradient(180deg,transparent 0,transparent 500px,#000 700px,#000 1500px,transparent 1700px)"><div id="feed" class="abs" style="left:0;right:0;top:0;height:1920px">${tx.concat(tx).map(([a, b], i) => `<div class="glass row" style="top:${560 + i * 136}px;opacity:.85"><span style="color:rgba(255,255,255,.7)">${a}</span><span class="ltr" style="color:${b[0] === '+' ? '#8fd1b5' : '#ff9a9a'}">${b} ل.س</span></div>`).join('')}</div></div>
    ${cap('c1', [['كل يوم…', 0.0], ['بتبيع،', 1.1], ['وبتشتري،', 1.92], ['وبتتعب.', 2.68]], 4.05)}`,
  s2: `${cap('c2', [['بآخر الشهر…', 4.1], ['وين راحت', 5.64], ['المصاري؟', 6.08, 'gold']], 7.0)}
    <div class="glass" id="bal" style="left:170px;right:170px;top:760px;height:330px;padding:40px 50px"><div style="font-size:38px;color:rgba(255,255,255,.6);font-weight:700">الرصيد آخر الشهر</div><div style="display:flex;justify-content:flex-end;align-items:baseline;gap:18px;margin-top:20px;white-space:nowrap"><span style="font-size:52px;font-weight:700;color:rgba(255,255,255,.6)">ل.س</span><span id="balv" class="ltr" style="font-size:120px;font-weight:900">0</span></div></div>`,
  s3: `${cap('c3', [['بضاعة', 7.04], ['عم تنقص…', 7.38], ['وما حدا عارف كيف', 8.3]], 9.4)}
    <div class="glass" id="it" style="left:200px;right:200px;top:720px;height:420px;padding:44px 54px">

      <div style="font-size:36px;color:rgba(255,255,255,.55);margin-top:16px">الكمية بالمستودع</div>

  s4: `${cap('c4', [['ديون عند الزباين…', 9.42], ['نصها', 11.1, 'redt'], ['انسى.', 11.32, 'redt']], 12.15)}
    ${debts.map(([n, v], i) => `<div class="glass row" id="db${i}" style="top:${640 + i * 140}px"><span>${n}</span><span class="ltr">${v} ل.س</span></div>`).join('')}`,
  s5: `${cap('c5', [['حساب بالليرة…', 12.16], ['وحساب بالدولار…', 13.38], ['والفرق', 14.62], ['ضايع بالنص', 15.04, 'redt']], 16.05)}
    <div class="glass" id="cl" style="left:150px;width:340px;top:760px;height:380px;display:grid;place-items:center;font-size:110px;font-weight:900">ل.س</div>

    <div class="glass" id="slip" style="left:190px;right:190px;top:680px;height:560px;padding:44px 54px;font-size:40px;font-weight:700">

      <div style="display:flex;justify-content:space-between;color:rgba(255,255,255,.7);margin-top:30px"><span>الموجود فعلاً</span><span class="ltr">1,180,000</span></div>
      <div style="height:3px;background:rgba(255,255,255,.2);margin:40px 0"></div>
      <div id="diff" style="display:flex;justify-content:space-between;font-size:60px;font-weight:900;color:#ff5f5f"><span>الفرق</span><span class="ltr">− 70,000</span></div></div>`,

    ${cap('c7a', [['المشكلة', 18.7], ['مو بشغلك…', 19.3]], 20.1, 700, 96)}

const bg = $('bg').getContext('2d');
function drawBg(t) {
  const w = eio(P(t, 23.9, 25.0));
  const top = [lerp(14, 6, w), lerp(18, 34, w), lerp(24, 28, w)], bot = [lerp(4, 2, w), lerp(6, 14, w), lerp(9, 11, w)];
  const gr = bg.createLinearGradient(0, 0, 0, 1920); gr.addColorStop(0, `rgb(${top.map(Math.round)})`); gr.addColorStop(1, `rgb(${bot.map(Math.round)})`);
  bg.fillStyle = gr; bg.fillRect(0, 0, 1080, 1920);
  const spot = (x, y, r, col) => { const g = bg.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); bg.fillStyle = g; bg.fillRect(0, 0, 1080, 1920); };
  spot(540 + Math.sin(t * 0.3) * 120, 820, 900, `rgba(${Math.round(lerp(90, 30, w))},${Math.round(lerp(110, 170, w))},${Math.round(lerp(140, 140, w))},${lerp(0.16, 0.32, w)})`);

}

// ── المشاهد ──
const R = {
  s1(t) { capR(t, 'c1'); $('feed').style.transform = `translateY(${(-t * (180 - 60 * P(t, 3.0, 4.1))).toFixed(1)}px)`; $('feed').style.opacity = (0.9 - 0.4 * P(t, 3.2, 4.1)).toFixed(3); },

      el.style.opacity = a.toFixed(3); el.style.transform = `translate(${(d.x + drift).toFixed(1)}px,${(d.y - drift * 0.5).toFixed(1)}px) rotate(${d.r}deg) scale(${d.s})`; el.style.filter = `blur(${(1.5 + (i % 3)).toFixed(1)}px)`; });

function phoneIn(id, t, a) { const el = $(id); const x = eo(P(t, a, a + 0.6)); const base = el.style.transform.match(/scale\([^)]*\)/); el.style.opacity = x.toFixed(3); el.style.transform = `translateY(${((1 - x) * 220).toFixed(1)}px) scale(${(Number(el.dataset.s) * (0.96 + 0.04 * x)).toFixed(4)})`; }
function chipIn(el, t, at, out, side) { const x = P(t, at, at + 0.35), o = P(t, out - 0.3, out); el.style.opacity = (eo(x) * (1 - o)).toFixed(3); el.style.transform = `translateX(${(side * (1 - eo(x)) * 120).toFixed(1)}px) scale(${(0.9 + 0.1 * back(x)).toFixed(3)})`; }

function scenes(t) {

function sweep(t) { const x = P(t, 23.95, 24.9); $('sweep').style.opacity = x > 0 && x < 1 ? (Math.sin(x * Math.PI) * 0.9).toFixed(3) : 0; $('sweep').style.backgroundPosition = `${(100 - x * 100).toFixed(1)}% 0`; }
