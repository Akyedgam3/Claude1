<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>

*{margin:0;box-sizing:border-box}html{background:#000}body{width:164px;height:314px;overflow:hidden;font-family:C;color:#fff;background:radial-gradient(ellipse at 50% 25%,#14574a 0%,#0b2a25 60%,#061612 100%);position:relative}

</style></head><body><div class="g"></div><div class="b"></div><div class="c"><img src="logo.png"><h1>ميزان</h1><p>حساباتك صارت بميزان</p>
