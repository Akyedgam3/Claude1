* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: Cairo, sans-serif; color: #fff; }

.shadow { text-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
/* الجوال */
.phone { position: absolute; width: 470px; left: 305px; border-radius: 70px; padding: 12px; background: linear-gradient(150deg, #2a3532, #050807); box-shadow: 0 60px 120px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 255, 255, 0.14); }
.phone canvas, .phone img { display: block; width: 446px; height: 965px; border-radius: 58px; background: #f4f7f6; }
.phone::after { content: ''; position: absolute; top: 26px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: #000; border-radius: 16px; }
/* أيقونات «3D» (لامعة، منفوخة) */
.i3d { position: absolute; width: 220px; height: 220px; border-radius: 64px; display: grid; place-items: center; box-shadow: inset 0 -16px 30px rgba(0, 0, 0, 0.28), inset 0 14px 24px rgba(255, 255, 255, 0.55), 0 30px 60px rgba(0, 0, 0, 0.35); opacity: 0; }
.i3d::before { content: ''; position: absolute; left: 18%; top: 9%; width: 46%; height: 24%; border-radius: 50%; background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0)); }
.i3d .ic { width: 52%; height: 52%; color: #fff; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.25)); }
.chip { position: absolute; padding: 18px 40px; border-radius: 999px; font-size: 54px; font-weight: 900; white-space: nowrap; opacity: 0; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3); }
.card { position: absolute; left: 150px; right: 150px; height: 190px; border-radius: 48px; background: #fff; color: #10211d; padding: 26px 40px; opacity: 0; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25); }
.card span { font-size: 40px; font-weight: 700; color: #50625d; }

.notif { position: absolute; left: 150px; right: 150px; height: 170px; border-radius: 44px; background: #fff; color: #10211d; display: flex; align-items: center; gap: 26px; padding: 0 34px; opacity: 0; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3); }
.notif .ic { width: 104px; height: 104px; padding: 20px; border-radius: 28px; background: linear-gradient(135deg, #3be47b, #15a854); color: #fff; flex: none; }
.notif b { display: block; font-size: 44px; font-weight: 900; }
.notif small { font-size: 32px; font-weight: 700; color: #5d6b67; }
.ring { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; border: 8px solid #fff; opacity: 0; }
.rays { position: absolute; left: 50%; top: 50%; width: 2800px; height: 2800px; margin: -1400px 0 0 -1400px; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 255, 255, 0.16) 0deg 7deg, transparent 7deg 20deg); -webkit-mask: radial-gradient(circle, #000 0%, transparent 60%); opacity: 0; }
.logo { position: absolute; width: 380px; height: 380px; left: 350px; border-radius: 100px; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45); opacity: 0; }

.prod h4 { font-size: 42px; font-weight: 900; }
.bars { display: flex; height: 110px; margin-top: 14px; direction: ltr; }

.tile .ic { width: 58%; height: 58%; color: #fff; }
.num { position: absolute; left: 140px; right: 140px; height: 180px; border-radius: 56px; background: rgba(255, 255, 255, 0.1); border: 3px solid rgba(255, 255, 255, 0.25); display: flex; justify-content: center; align-items: center; gap: 28px; direction: ltr; opacity: 0; }
.num span { font-size: 104px; font-weight: 900; color: rgba(255, 255, 255, 0.5); display: inline-block; }
.pill { position: absolute; left: 50%; padding: 26px 74px; border-radius: 999px; background: linear-gradient(135deg, #3be47b, #15a854); font-size: 84px; font-weight: 900; white-space: nowrap; box-shadow: 0 30px 80px rgba(21, 168, 84, 0.5); opacity: 0; }
.laptop { position: absolute; width: 760px; left: 160px; }
.laptop .lid { background: #0b1210; border-radius: 30px 30px 8px 8px; padding: 16px; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5); }
.laptop .lid img { width: 100%; display: block; border-radius: 10px; aspect-ratio: 16/10; object-fit: cover; object-position: top right; }
.laptop .base { height: 30px; margin: 0 -40px; background: linear-gradient(180deg, #e4e9ec, #8c959c); border-radius: 0 0 36px 36px; }
#strobe, #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
#flash { background: #fff; }
#grain { position: absolute; inset: -100px; opacity: 0.05; mix-blend-mode: overlay; pointer-events: none; }
canvas.fx { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"><div id="beats"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const ei = (x) => x * x * x;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const spring = (x) => (x <= 0 ? 0 : 1 - Math.exp(-7 * x) * Math.cos(11 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const fmt = (n) => Math.round(n).toLocaleString('en');
const ICONS = __ICONS__;
const icon = (n) => `<span class="ic">${ICONS[n]}</span>`;
window.DURATION = 61;

// ── الصوت هو الساعة: كل بيت بيبلّش على كلمة (توقيت الكلمات من التسجيل) ──
// [بداية، نهاية، خلفية، نوع القطع]
const B = {};

  ['sale', 7.3, 10.52, 'linear-gradient(160deg,#0c3b33,#06201b)', 'whip'],
  ['stock', 10.52, 12.39, '#13294b', 'tape'],
  ['items', 12.39, 15.94, 'linear-gradient(180deg,#ffffff,#e9f2ef)', 'zoom'],
  ['debt', 15.94, 18.12, '#ff7a1a', 'punch'],

];
const NUMS = [[51.37, 52.7], [52.74, 53.9], [53.95, 55.2], [55.98, 57.3], [57.38, 58.6], [58.68, 59.7]];
const STROBES = [4.95, 46.73];
const IMPACTS = [[0.05, 8], [0.88, 10], [2.62, 10], [3.06, 14], [3.73, 16], [4.95, 28], [6.7, 12], [9.68, 14], [11.34, 10], [16.5, 14], [21.08, 10], [22.97, 14], [25.51, 10], [26.36, 10], [27.03, 10], [29.36, 18], [34.54, 10], [35.84, 12], [39.08, 9], [40.08, 9], [40.65, 9], [41.43, 9], [43.6, 14], [46.73, 26], [49.25, 10]];

// ── أدوات الحركة ──
// كلمة بتنزل ضخمة: من 2.2× مضبّبة، بتتخطى وبترجع، وبتطلع (بتصغر وبتضبّب) قبل الكلمة الجاية
function slam(el, t, at, out = 1e9, from = 2.2, rot = 0) {
  const x = P(t, at, at + 0.42), o = P(t, out - 0.16, out);
  if (t < at || o >= 1) { el.style.opacity = 0; return; }
  const s = from - (from - 1) * spring(x * 1.15);
  el.style.opacity = (Math.min(1, x * 4) * (1 - o)).toFixed(3);
  el.style.transform = `scale(${(s * (1 - 0.25 * o)).toFixed(4)}) rotate(${(rot * (1 - eo(x))).toFixed(2)}deg)`;
  const bl = (1 - Math.min(1, x * 2.2)) * 18 + o * 16;
  el.style.filter = bl > 0.1 ? `blur(${bl.toFixed(1)}px)` : 'none';
}
function rise(el, t, at, out = 1e9, dy = 90) {
  const x = P(t, at, at + 0.4), o = P(t, out - 0.16, out);
  if (t < at || o >= 1) { el.style.opacity = 0; return; }
  const k = back(x);
  el.style.opacity = (Math.min(1, x * 3) * (1 - o)).toFixed(3);
  el.style.transform = `translateY(${((1 - k) * dy - o * 40).toFixed(1)}px) scale(${(1.12 - 0.12 * Math.min(1, k) - o * 0.1).toFixed(4)})`;
  const bl = (1 - Math.min(1, x * 2.5)) * 12 + o * 12;
  el.style.filter = bl > 0.1 ? `blur(${bl.toFixed(1)}px)` : 'none';
}
function pop(el, t, at, out = 1e9, fromX = 0, fromY = 120) {
  const x = P(t, at, at + 0.38), o = P(t, out - 0.16, out);
  if (t < at || o >= 1) { el.style.opacity = 0; return; }
  const k = back(x);
  el.style.opacity = (Math.min(1, x * 3) * (1 - o)).toFixed(3);
  el.style.transform = `translate(${(fromX * (1 - k)).toFixed(1)}px,${(fromY * (1 - k)).toFixed(1)}px) scale(${(0.6 + 0.4 * k - 0.2 * o).toFixed(3)})`;
}
function ringFx(el, t, at, max = 9, dur = 0.9) {
  const x = P(t, at, at + dur);
  if (x <= 0 || x >= 1) { el.style.opacity = 0; return; }
  el.style.opacity = ((1 - x) * 0.9).toFixed(3);
  el.style.transform = `scale(${(0.4 + eo(x) * max).toFixed(3)})`;
}
const count = (t, a, b, to) => to * eo(P(t, a, b));

// ── شاشات الجوال المسجّلة (فريم فريم) ──
const REC = __REC__;
const FR = {};
const imgs = [];
for (const [name, n] of Object.entries(REC)) {
  FR[name] = Array.from({ length: n }, (_, i) => { const im = new Image(); im.src = `rec/${name}/${String(i).padStart(3, '0')}.jpg`; imgs.push(im); return im; });
}
function phoneHTML(id, top, extra = '') { return `<div class="phone" id="${id}" style="top:${top}px;${extra}"><canvas width="780" height="1688"></canvas></div>`; }
/** بيرسم فريم الشاشة حسب التقدّم (0..1) بالتمرير. */
function drawRec(id, name, x) {
  const c = $(id).querySelector('canvas');
  const f = FR[name];
  const im = f[Math.min(f.length - 1, Math.max(0, Math.round(x * (f.length - 1))))];
  if (c._last !== im) { c.getContext('2d').drawImage(im, 0, 0, 780, 1688); c._last = im; }
}

// ── بناء البيتات ──
const H = {
  paper: `<div class="hw" id="p1" style="top:700px;font-size:330px;color:#2a2116">دفاتر…</div>
    <div class="abs" id="pl" style="inset:0;background:repeating-linear-gradient(180deg,transparent 0 78px,rgba(70,90,140,.25) 78px 81px)"></div>`,
  calc: `<div class="hw" id="c1" style="top:1080px;font-size:250px">حاسبة…</div>
    <div class="abs" id="c2" style="left:340px;top:420px;width:400px;height:560px;border-radius:44px;background:linear-gradient(160deg,#4a525d,#1c2026);padding:36px;box-shadow:0 40px 80px rgba(0,0,0,.6)">
      <div id="lcd" style="height:120px;border-radius:16px;background:#a6bf9f;color:#24331f;font:900 76px/120px Cairo;text-align:left;padding:0 22px;direction:ltr">0.</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px">${'<i style="height:70px;border-radius:16px;background:#5b636e;display:block"></i>'.repeat(16)}</div></div>`,
  night: `<div class="hl" id="n1" style="top:420px;font-size:120px">وآخر الليل…</div>
    <div class="hw ltr" id="n2" style="top:780px;font-size:300px;color:#ff4d4d;letter-spacing:10px;text-shadow:0 0 60px rgba(255,60,60,.7)">02:47</div>`,
  win: `<div class="hw" id="w1" style="top:640px;font-size:330px">ربحت؟</div><div class="i3d" id="w2" style="left:430px;top:1120px;background:linear-gradient(135deg,#3be47b,#0f8a4f)">${icon('trending-up')}</div>`,
  lose: `<div class="hw" id="l1" style="top:640px;font-size:330px">خسرت؟</div><div class="i3d" id="l2" style="left:430px;top:1120px;background:linear-gradient(135deg,#ff6b6b,#a50e17)"><span class="ic" style="transform:scaleY(-1)">${ICONS['trending-up']}</span></div>`,
  enough: `<div class="hw" id="e1" style="top:700px;font-size:380px">خلص.</div><div class="hl" id="e2" style="top:760px;font-size:130px">صار في…</div>`,
  lock1: `<div class="rays" id="r1"></div><div class="ring" id="g1"></div><div class="ring" id="g2"></div><img class="logo" id="lg1" src="logo.png" style="top:520px" alt="" /><div class="hw" id="k1" style="top:960px;font-size:300px">وزن</div>`,
  tap: `<div class="hl" id="t1" style="top:330px;color:#06352d">فاتورة؟</div>
    <div class="abs" id="t2" style="left:190px;right:190px;top:760px;height:300px;border-radius:90px;background:linear-gradient(180deg,#1aa588,#0b5c4c);box-shadow:inset 0 -18px 0 #07443a,0 40px 70px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:24px;font-size:96px;font-weight:900;opacity:0">${icon('receipt').replace('class="ic"', 'class="ic" style="width:100px;height:100px"')}فاتورة مبيع</div>
    <div class="hw" id="t3" style="top:1180px;font-size:260px;color:#06352d">كبسة</div>
    <div class="ring" id="t4" style="top:910px;border-color:#06352d"></div>`,
  sale: `${phoneHTML('ph1', 520)}
    <div class="prod" id="pr" style="left:110px;top:1180px"><h4>رز مصري 1 كغ</h4><div class="bars" id="bars"></div><div class="laser" id="lz"></div></div>
    <div class="hl" id="s1" style="top:250px;font-size:100px">بتمسح <span class="acc">الباركود</span></div>
    <div class="hl" id="s2" style="top:250px;font-size:100px">بتنضاف المادة…</div>
    <div class="stamp" id="s3" style="top:880px;color:#5fe0bf;margin-left:-230px;background:rgba(4,30,25,.75)">جاهز ✓</div>`,
  stock: `<div class="hl" id="k3" style="top:430px;font-size:110px">شو باقي…</div><div class="hw" id="k4" style="top:760px;font-size:200px">بالمستودع؟</div>
    <div class="i3d" id="k5" style="left:430px;top:1140px;background:linear-gradient(135deg,#6ea0ff,#2346a6)">${icon('layers')}</div>`,
  items: `${phoneHTML('ph2', 520)}<div class="hl" id="i1" style="top:250px;color:#0b2e27">قائمة <span style="color:#14957c">المواد</span></div>
    <div class="chip" id="i2" style="left:110px;top:1150px;background:#14957c;color:#fff">بالكمية</div>
    <div class="chip" id="i3" style="right:110px;top:1300px;background:#ffcf5a;color:#3b2a03">والسعر</div>`,
  debt: `<div class="hl" id="d1" style="top:430px;font-size:110px">زبون عليه…</div><div class="hw" id="d2" style="top:740px;font-size:380px">دين؟</div>`,

    <div class="notif" id="a2" style="top:620px">${icon('message-circle')}<div><b>أبو خالد</b><small>عليك 11,000 ل.س · تذكير بالدفع</small></div></div>
    <div class="notif" id="a3" style="top:820px">${icon('message-circle')}<div><b>أم محمد</b><small>عليك 6,420 ل.س · تذكير بالدفع</small></div></div>
    <div class="notif" id="a4" style="top:1020px">${icon('message-circle')}<div><b>مطعم الضيعة</b><small>تذكير لطيف بموعد السداد</small></div></div>

function cutIn(el, kind, x) {
  // x = تقدّم دخول البيت (0..1) خلال أول 0.28 ثانية
  const e = eo(x);
  let tr = '', f = '';
  switch (kind) {
    case 'whip': tr = `translateX(${((1 - e) * -1100).toFixed(1)}px) skewX(${((1 - e) * 18).toFixed(2)}deg)`; f = x < 1 ? `blur(${((1 - e) * 26).toFixed(1)}px)` : ''; break;
    case 'zoom': tr = `scale(${(1.6 - 0.6 * e).toFixed(4)})`; f = x < 1 ? `blur(${((1 - e) * 20).toFixed(1)}px)` : ''; break;
    case 'dive': tr = `scale(${(0.35 + 0.65 * e).toFixed(4)}) rotate(${((1 - e) * -12).toFixed(2)}deg)`; f = x < 1 ? `blur(${((1 - e) * 14).toFixed(1)}px)` : ''; break;
    case 'punch': tr = `scale(${(1 + 0.12 * (1 - spring(x))).toFixed(4)})`; break;
    case 'tape': tr = `translateY(${((1 - e) * 1920).toFixed(1)}px) rotate(${((1 - e) * 6).toFixed(2)}deg)`; break;
    case 'glitch': { const r = rnd(Math.floor(x * 24) + 7); tr = x < 1 ? `translate(${((r() - 0.5) * 80 * (1 - x)).toFixed(1)}px,${((r() - 0.5) * 30 * (1 - x)).toFixed(1)}px)` : ''; f = x < 1 ? `hue-rotate(${(r() * 120 * (1 - x)).toFixed(0)}deg) contrast(${(1 + (1 - x)).toFixed(2)})` : ''; break; }
    default: tr = '';
  }
  el.style.transform = tr || 'none';
  el.style.filter = f || 'none';
}

function scene(t) {
  BEATS.forEach(([id, a, b, , kind], i) => {
    const el = $('B_' + id);
    const on = t >= a && t < b + (i === BEATS.length - 1 ? 1 : 0);
    el.style.display = on ? 'block' : 'none';
    if (!on) return;
    cutIn(el, kind, P(t, a, a + 0.28));
    R[id] && R[id](t, a, b);
  });
}

      el.style.opacity = Math.min(1, x * 3).toFixed(3);
      const k = back(x);
      el.style.transform = `translate(${lerp(465, p.x, k).toFixed(1)}px,${(lerp(825, p.y, k) + Math.sin(t * 2 + i) * 8).toFixed(1)}px) rotate(${(p.r * k + Math.sin(t + i) * 4).toFixed(1)}deg) scale(${(0.3 + 0.7 * Math.min(1, k)).toFixed(3)})`;
    });
    $('b1').textContent = '+' + Math.round(count(t, 42.4, 43.6, 25));
    slam($('b1'), t, 42.4, 44.26, 1.6); slam($('b2'), t, 43.6, 44.26, 2.2);
  },
  screens(t) {
    rise($('f4'), t, 44.26);
    [['f1', 'items', -24, -280, 44.4], ['f2', 'home', 0, 0, 44.6], ['f3', 'debts', 24, 280, 45.12]].forEach(([id, rec, r, dx, at]) => {
      const x = back(P(t, at, at + 0.5)); const el = $(id);
      el.style.opacity = P(t, at, at + 0.12).toFixed(3);
      el.style.transform = `translate(${(dx * x).toFixed(1)}px,${((1 - x) * 700 + Math.abs(r) * 3).toFixed(1)}px) rotate(${(r * x).toFixed(2)}deg) scale(${(0.72 + 0.08 * x).toFixed(3)})`;
      el.style.zIndex = id === 'f2' ? 3 : 2;
      drawRec(id, rec, P(t, at + 0.2, 46.6));
    });
  },
  lock2(t) {
    $('r2').style.opacity = eo(P(t, 46.73, 47.1)).toFixed(3); $('r2').style.transform = `rotate(${((t - 46.7) * 30).toFixed(1)}deg)`;
    slam($('lg2'), t, 46.73, 1e9, 3, 14); slam($('k6'), t, 46.83, 1e9, 2);
    ringFx($('g3'), t, 46.73, 10, 1); ringFx($('g4'), t, 46.9, 8, 1);
    rise($('k7'), t, 47.49);
    if (t > 47.5) $('lg2').style.transform = `scale(${(1 + 0.03 * Math.sin((t - 46.7) * 5)).toFixed(4)})`;
  },
  offer(t) {
    const p = $('w0'); const x = P(t, 49.25, 49.65);
    p.style.opacity = Math.min(1, x * 3).toFixed(3); p.style.transform = `translateX(-50%) scale(${(0.4 + 0.6 * back(x) + 0.025 * Math.sin(t * 6)).toFixed(4)})`;
    pop($('w9'), t, 50.0); rise($('w8'), t, 50.32);
    pop($('nm1'), t, 51.1); pop($('nm2'), t, 55.6);
    ['g0', 'g1n', 'g2n', 'g3n', 'g4n', 'g5n'].forEach((id, i) => {
      const [a, b] = NUMS[i]; const el = $(id); const on = t >= a - 0.05, act = on && t <= b + 0.1;
      const k = act ? back(P(t, a - 0.05, a + 0.3)) : 0;
      el.style.color = act ? '#ffcf5a' : on ? '#fff' : '';
      el.style.transform = `scale(${(1 + 0.2 * k * (1 - P(t, b, b + 0.2))).toFixed(3)})`;
    });
    const e = P(t, 59.6, 60.1); $('endc').style.opacity = e.toFixed(3); $('endc').style.transform = `translateY(${((1 - eo(e)) * 80).toFixed(1)}px)`;
  },
};
const AI = new Image(); AI.src = 'rec/ai.jpg'; imgs.push(AI);

// ── فلاش، ستروب، كاميرا، جزيئات ──
const fx = $('fx').getContext('2d');
function effects(t) {
  // ستروب 6 فريمات (أخضر، وردي، أزرق) على الشعار
  let st = '';
  for (const s of STROBES) { const f = Math.floor((t - s) * 30); if (f >= 0 && f < 6) st = ['#3be47b', '#ff4fb0', '#4f8bff'][f % 3]; }
  $('strobe').style.background = st || 'transparent'; $('strobe').style.opacity = st ? 0.85 : 0; $('strobe').style.mixBlendMode = 'screen';
  // فلاش أبيض على قطعات الفلاش
  let fl = 0;
  for (const [, a, , , k] of BEATS) if (k === 'flash') { const x = P(t, a, a + 0.25); if (x > 0 && x < 1) fl = Math.max(fl, 0.75 * (1 - eo(x))); }
  $('flash').style.opacity = fl.toFixed(3);
  // هزة الكاميرا
  let sx = 0, sy = 0, rz = 0;
  for (const [ti, amp] of IMPACTS) { const dt = t - ti; if (dt < 0 || dt > 0.55) continue; const e = amp * Math.exp(-dt * 10); sx += Math.sin(dt * 95) * e; sy += Math.cos(dt * 80) * e * 0.8; rz += Math.sin(dt * 60) * e * 0.02; }
  $('cam').style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) rotate(${rz.toFixed(3)}deg) scale(${(1 + 0.01 * Math.sin(t * 0.8)).toFixed(4)})`;
  // جزيئات
  fx.clearRect(0, 0, 1080, 1920); fx.globalCompositeOperation = 'lighter';
  for (const b of BURSTS) {
    const dt = t - b.t0; if (dt < 0 || dt > 2.2) continue;
    for (const q of b.parts) { if (dt > q.life) continue; const k = dt / q.life; fx.globalAlpha = (1 - k) * (1 - k); fx.fillStyle = q.c; fx.beginPath(); fx.arc(b.x + q.vx * dt * (1 - k * 0.45), b.y + q.vy * dt * (1 - k * 0.45) + 0.5 * b.g * dt * dt, q.s * (1 - k * 0.5), 0, 6.283); fx.fill(); }
  }
  fx.globalAlpha = 1; fx.globalCompositeOperation = 'source-over';
  // مطر أيقونات بالختام
  if (t > 46.9 && t < 49.3) for (const h of RAIN) { const dt = t - 46.9 - h.d; if (dt < 0) continue; const y = -60 + dt * h.v; if (y > 1980) continue; fx.globalAlpha = 0.9; fx.fillStyle = h.c; fx.beginPath(); fx.arc(h.x + Math.sin(dt * 3) * 30, y, h.s / 2, 0, 6.283); fx.fill(); }
  fx.globalAlpha = 1;
  const gr = rnd(Math.floor(t * 30) + 1); $('grain').style.transform = `translate(${Math.floor(gr() * 100)}px,${Math.floor(gr() * 100)}px)`;
  $('stage').style.opacity = (1 - P(t, 60.4, 61)).toFixed(3);
}

window.render = function (t) { scene(t); effects(t); };
// كل كلمة كبيرة لازم توسع جوّا المنطقة الآمنة (عرض 860): منصغّر الخط لحد ما توسع
function fitWords() {
  for (const sec of document.querySelectorAll('.beat')) {
    sec.style.display = 'block';
    for (const el of sec.querySelectorAll('.hw')) {
      el.style.opacity = 1; el.style.transform = 'none'; el.style.left = '0'; el.style.right = 'auto'; el.style.width = 'auto'; el.style.display = 'inline-block';
      let fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > 860 && fs > 60) { fs -= 6; el.style.fontSize = fs + 'px'; }
      el.style.left = ''; el.style.right = ''; el.style.width = ''; el.style.display = ''; el.style.opacity = 0;
    }
    sec.style.display = 'none';
  }
}
Promise.all([document.fonts.ready, ...[...document.images, ...imgs].map((im) => (im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; })))]).then(() => { fitWords(); window.render(0); window.READY = true; });
</script>
